server:
  port: 8088
  servlet:
    # 解决使用flux流式返回乱码
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: chatMemory4Redis
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
  data:
    redis:
      host: localhost
      port: 6379
      # password: your_password
      database: 5
      timeout: 3000 # 连接超时时间（毫秒）
      jedis:
        pool:
          max-active: 200
          max-idle: 10
          min-idle: 0
