server:
  port: 8082
  servlet:
    # 解决使用flux流式返回乱码
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: ollama
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
    ollama:
      # ollama 本地地址
      base-url: http://localhost:11434
      chat:
        model: qwen3.5:0.8b
